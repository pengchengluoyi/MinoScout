<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5 受控登录 Demo</title>
<style>body{font-family:system-ui;max-width:600px;margin:50px auto;padding:16px;background:#f3f5f9;color:#182333}label{display:block;margin:16px 0}input,button{font:inherit;padding:8px}section{padding:24px;background:white;border-radius:14px}[hidden]{display:none!important}#error{color:#b42318}</style></head>
<body><main><h1>V5 受控登录 Demo</h1><p>仅用于开发验收，示例账号 demo / demo-valid，不是真实认证服务。</p>
<a data-testid="previous" href="/previous">历史页</a> · <a href="/login">登录页</a>
<section><form id="login" novalidate>
<label>账号 <input name="username" data-testid="username" autocomplete="off"></label>
<label>密码 <input name="password" type="password" data-testid="password" autocomplete="off"></label>
<label><input type="checkbox" name="consent" data-testid="consent">同意示例条款</label>
<label>受控提交延迟（0–12000ms） <input name="delay" type="number" data-testid="delay" value="0" min="0" max="12000"></label>
<button data-testid="submit">登录</button></form>
<p data-testid="error" id="error" hidden></p>
<div data-testid="logged-in-marker" hidden><strong>登录成功</strong><p data-testid="identity">demo-user</p></div>
<button type="button" data-testid="reset">复位页面</button>
<button type="button" data-testid="add-duplicate">添加重复目标</button>
</section><p id="status" role="status"></p></main>
<script>
const form=document.querySelector('#login'),error=document.querySelector('#error'),marker=document.querySelector('[data-testid="logged-in-marker"]'),status=document.querySelector('#status');
for(const input of form.querySelectorAll('input'))input.addEventListener('input',()=>fetch('/interaction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:input.name})}).catch(()=>{status.textContent='交互计数服务不可用'}));
form.addEventListener('submit',async event=>{event.preventDefault();error.hidden=true;if(!form.username.value){error.textContent='账号不能为空';error.hidden=false;return}const button=form.querySelector('button');button.disabled=true;try{const response=await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value,consent:form.consent.checked,delay_ms:Number(form.delay.value)})});if(!response.ok)throw new Error('提交服务不可用');const result=await response.json();if(result.ok){marker.hidden=false;form.hidden=true}else{error.textContent=result.message;error.hidden=false}}catch(cause){error.textContent=cause.message;error.hidden=false}finally{button.disabled=false}});
document.querySelector('[data-testid="reset"]').addEventListener('click',async()=>{form.reset();form.hidden=false;marker.hidden=true;error.hidden=true;document.querySelectorAll('[data-duplicate]').forEach(node=>node.remove());try{await fetch('/reset',{method:'POST'});status.textContent='页面已复位，累计提交次数保留'}catch{status.textContent='复位服务不可用'}});
document.querySelector('[data-testid="add-duplicate"]').addEventListener('click',()=>{const copy=form.username.cloneNode();copy.dataset.duplicate='true';form.append(copy)});
</script></body></html>
