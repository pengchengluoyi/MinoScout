apiVersion: v1
kind: Plugin
metadata:
  author: mino
  name: mino-bridge
  version: 0.1.1
  label:
    en_US: Mino Bridge
    zh_Hans: Mino 桥接
  description:
    en_US: Forward incoming IM messages to the local MinoScout and stop LangBot's default handling.
    zh_Hans: 把收到的 IM 消息转给本机 MinoScout，并阻止 LangBot 默认处理（不调用任何模型）。
spec:
  config: []
  components:
    EventListener:
      fromDirs:
        - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: MinoBridge
