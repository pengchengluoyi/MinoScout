name: Release Scout

# Candidate dispatch builds artifacts only; tags publish after every native build passes.
on:
  push:
    branches: ['main']
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      rollback_evidence_json:
        description: '已实测的新旧 build、全部发布平台的更新/回退/配置保留及证据 URL（JSON 数组）'
        required: false
        default: '[]'
        type: string

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: meta
        shell: bash
        run: |
          PKG="$(unset SCOUT_VERSION; python scripts/pack_release.py --print-version)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PRE=false
            if [[ "$PKG" != "$VERSION" ]]; then
              echo "::error::pyproject.toml version ${PKG} does not match tag ${VERSION}"
              exit 1
            fi
          else
            VERSION="$PKG"
            TAG="dev-${GITHUB_SHA:0:7}"
            PRE=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "Scout ${VERSION}  tag ${TAG}  prerelease=${PRE}"

  build:
    needs: [meta]
    name: Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 在各自平台原生冻结：macOS Apple Silicon + Windows x64 + Linux x64。
        # Linux 用 ubuntu-22.04（glibc 2.35），比 ubuntu-latest 兼容更多发行版。
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $installer = (Resolve-Path "packaging/install.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Install pack tools
        run: |
          python -m pip install -U pip
          python -m pip install pyinstaller
          python -m pip install .
      - name: Include PC Desktop SDK
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Validate PC SDK native library
        if: runner.os != 'Linux'
        run: python -c "import cua_driver; from importlib.metadata import version; assert version('cua-driver') == '0.34.1'; print('PC SDK native library loaded')"
      - name: Verify real Windows credential storage
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PYCODE'
          import uuid
          from mino_scout.plugins.secret_store import _win_get, _win_put, _win_delete
          account = 'ci-native-' + uuid.uuid4().hex
          value = uuid.uuid4().hex
          try:
              assert _win_get(account) == ''
              _win_put(account, value)
              assert _win_get(account) == value
              _win_delete(account)
              assert _win_get(account) == ''
              _win_delete(account)
          finally:
              _win_delete(account)
          print('Windows credential missing/write/read/delete passed')
          PYCODE
      - name: Freeze, probe, pack zips
        env:
          SCOUT_VERSION: ${{ needs.meta.outputs.version }}
          MINO_SCOUT_SKIP_BROWSER: "1"
        run: python scripts/pack_release.py --out dist --binary
      - name: Verify installed Windows Scout has no visible console
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PYCODE'
          import ctypes, json, os, pathlib, subprocess, time, uuid, zipfile
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])/'scout-native-check'
          temp.mkdir()
          item = json.loads(pathlib.Path('dist/item-win32-x64.json').read_text())
          with zipfile.ZipFile(pathlib.Path('dist')/item['filename']) as archive:
              archive.extractall(temp/'package')
          installer = next((temp/'package').glob('*/install.ps1'))
          home = temp/'home'
          home.mkdir()
          (home/'config.json').write_text(json.dumps({'nexus_url':'http://127.0.0.1:50104','token':uuid.uuid4().hex}))
          env = dict(os.environ, MINO_SCOUT_HOME=str(home))
          exe = home/'bin/mino-scout.exe'
          try:
              subprocess.run(['powershell.exe','-NoProfile','-ExecutionPolicy','Bypass','-File',str(installer)],env=env,check=True)
              deadline = time.monotonic()+60
              while not (home/'scout.pid').exists() and time.monotonic()<deadline:
                  time.sleep(.5)
              pid = int((home/'scout.pid').read_text().strip())
              import psutil
              time.sleep(2)
              assert pathlib.Path(psutil.Process(pid).exe()).resolve() == exe.resolve()
              kernel = ctypes.WinDLL('kernel32', use_last_error=True)
              user = ctypes.WinDLL('user32', use_last_error=True)
              kernel.GetConsoleWindow.restype = ctypes.c_void_p
              user.IsWindowVisible.argtypes = [ctypes.c_void_p]
              kernel.FreeConsole()
              if kernel.AttachConsole(pid):
                  window = kernel.GetConsoleWindow()
                  assert not (window and user.IsWindowVisible(window)), 'Scout console is visible'
                  kernel.FreeConsole()
              else:
                  assert ctypes.get_last_error() == 6, 'Unable to inspect Scout console'
              print('Installed Scout running with no visible console; Nexus connection not exercised')
          finally:
              if exe.exists():
                  subprocess.run([str(exe),'stop'],env=env,check=True)
          PYCODE
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: scout-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
          pattern: scout-*
      - name: Write manifest.json
        if: hashFiles('dist/item-*.json') != ''
        env:
          SCOUT_VERSION: ${{ needs.meta.outputs.version }}
          SCOUT_RELEASE_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}
          SCOUT_ROLLBACK_EVIDENCE_JSON: ${{ inputs.rollback_evidence_json || '[]' }}
        run: python scripts/write_manifest.py --dist dist --out dist/manifest.json
      - name: Attach packages to the Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Mino Scout ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/manifest.json
            packaging/bootstrap.sh
            packaging/bootstrap.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
