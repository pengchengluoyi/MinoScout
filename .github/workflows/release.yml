name: Release Scout

# A v* tag opens the GitHub Release immediately. Packs attach when ready;
# one OS failing must not leave the tag without a Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: meta
        shell: bash
        run: |
          PKG="$(unset SCOUT_VERSION; python scripts/pack_release.py --print-version)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PRE=false
            if [[ "$PKG" != "$VERSION" ]]; then
              echo "::error::pyproject.toml version ${PKG} does not match tag ${VERSION}"
              exit 1
            fi
          else
            VERSION="$PKG"
            TAG="dev-${GITHUB_SHA:0:7}"
            PRE=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "Scout ${VERSION}  tag ${TAG}  prerelease=${PRE}"

  open-release:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Open GitHub Release for this tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Mino Scout ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ needs.meta.outputs.prerelease != 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [meta]
    name: Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 在各自平台原生冻结：macOS Apple Silicon + Windows x64。
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $installer = (Resolve-Path "packaging/install.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($installer, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
      - name: Install pack tools
        run: |
          python -m pip install -U pip
          python -m pip install pyinstaller
          python -m pip install .
      - name: Include PC Desktop SDK
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: python -m pip install ".[desktop]"
      - name: Validate PC SDK native library
        run: python -c "import cua_driver; from importlib.metadata import version; assert version('cua-driver') == '0.34.1'; print('PC SDK native library loaded')"
      - name: Freeze, probe, pack zips
        env:
          SCOUT_VERSION: ${{ needs.meta.outputs.version }}
          MINO_SCOUT_SKIP_BROWSER: "1"
        run: python scripts/pack_release.py --out dist --binary
      - uses: actions/upload-artifact@v5
        if: always() && !cancelled()
        with:
          name: scout-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [meta, open-release, build]
    if: always() && !cancelled() && needs.meta.result == 'success' && needs.open-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
          pattern: scout-*
      - name: Write manifest.json
        if: hashFiles('dist/item-*.json') != ''
        env:
          SCOUT_VERSION: ${{ needs.meta.outputs.version }}
          SCOUT_RELEASE_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}
        run: python scripts/write_manifest.py --dist dist --out dist/manifest.json
      - name: Attach packages to the Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Mino Scout ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/manifest.json
            packaging/bootstrap.sh
            packaging/bootstrap.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
