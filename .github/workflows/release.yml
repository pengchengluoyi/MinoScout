name: Release Scout

# A v* tag opens the GitHub Release immediately. Packs attach when ready;
# one OS failing must not leave the tag without a Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PRE=false
          else
            VERSION="$(python scripts/pack_release.py --print-version)"
            TAG="dev-${GITHUB_SHA:0:7}"
            PRE=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "Scout ${VERSION}  tag ${TAG}  prerelease=${PRE}"

  open-release:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open GitHub Release for this tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Mino Scout ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ needs.meta.outputs.prerelease != 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify hard constraints
        run: python scripts/verify_all.py
      - name: install
        run: pip install -e .
      - name: tests
        run: python tests/run_all.py

  build:
    needs: [meta, guards]
    name: Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pack tools
        run: |
          python -m pip install -U pip
          python -m pip install pyinstaller
          python -m pip install .
      - name: Freeze, probe, pack zip
        env:
          SCOUT_VERSION: ${{ needs.meta.outputs.version }}
        run: python scripts/pack_release.py --out dist --binary
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: scout-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [meta, open-release, build]
    if: always() && !cancelled() && needs.meta.result == 'success' && needs.open-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
          pattern: scout-*
      - name: Write manifest.json
        if: hashFiles('dist/item-*.json') != ''
        env:
          SCOUT_VERSION: ${{ needs.meta.outputs.version }}
          SCOUT_RELEASE_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}
        run: python scripts/write_manifest.py --dist dist --out dist/manifest.json
      - name: Attach packages to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Mino Scout ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist/*.zip
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
