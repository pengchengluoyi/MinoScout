name: verify

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 守门脚本刻意零依赖，用裸 python 跑，不装环境
      - name: verify hard constraints
        run: python scripts/verify_all.py
